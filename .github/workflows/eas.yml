# EAS — build the production mobile app ONLY on a release tag.
#
# Fires exclusively on `mobile-v*` tags. It NEVER runs on pull_request, on an
# ordinary branch push, or via an unguarded manual dispatch — each of those
# would be a way to fan out a paid iOS + Android build. The `production` profile
# already lives in apps/mobile/eas.json (store distribution, app-bundle,
# appVersionSource: remote, autoIncrement), so this workflow only supplies
# EXPO_TOKEN.
#
# Credit-burn guards:
#   - Tag-only trigger; no pull_request / branch push / workflow_dispatch.
#   - concurrency + cancel-in-progress so re-pushing or moving a mobile-v* tag
#     cannot fan out into duplicate paid runs (autoIncrement + remote version
#     means every run consumes a real version + build minutes).
#   - No auto store-submission flag on the build (submission stays manual).
#   - `mobile-v*` tags are RELEASE-ONLY — test/throwaway tags must not use the
#     prefix (documented in docs/deployment-guide.md).

name: EAS Production Build

on:
  push:
    tags:
      - 'mobile-v*'

concurrency:
  group: eas-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: eas-production-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install (immutable)
        run: yarn install --immutable
        working-directory: .

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Two explicit platform builds. Submission stays manual (no store-submit).
      - name: Build iOS (production)
        run: eas build --profile production --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (production)
        run: eas build --profile production --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
